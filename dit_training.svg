<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" width="1000" height="780">
  <title>DiT Diffusion Model — Training Loop</title>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap'); text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }</style>
    <filter id="shadow-sm" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-md" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000020"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F43F5E"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
    <linearGradient id="grad-spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="780" fill="#FFFFFF"/>
  <rect width="1000" height="780" fill="url(#grid)" opacity="0.55"/>

  <!-- Title -->
  <text x="40" y="42" font-size="18" font-weight="700" fill="#1E293B">DiT — Training Loop (one step)</text>
  <text x="40" y="62" font-size="12" font-weight="400" fill="#64748B">The model learns by corrupting LEGO positions with noise, then learning to predict and undo that noise</text>
  <line x1="40" y1="70" x2="540" y2="70" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════════════
       STEP 1 — INPUTS
  ═══════════════════════════════════════════ -->
  <text x="40" y="90" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">STEP 1 — INPUTS</text>

  <!-- x0: clean positions (amber) -->
  <rect x="30" y="100" width="250" height="78" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="30" y="100" width="4" height="78" rx="2" fill="#F59E0B"/>
  <text x="50" y="124" font-size="12" font-weight="600" fill="#92400E">Clean positions  x₀</text>
  <text x="50" y="141" font-size="10" fill="#B45309">(N, 3)  float32  — from dataset</text>
  <text x="50" y="157" font-size="10" fill="#B45309">real, unmodified LEGO brick positions</text>

  <!-- t: timestep (rose) -->
  <rect x="375" y="100" width="250" height="78" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="375" y="100" width="4" height="78" rx="2" fill="#F43F5E"/>
  <text x="395" y="124" font-size="12" font-weight="600" fill="#9F1239">Timestep  t</text>
  <text x="395" y="141" font-size="10" fill="#BE123C">t ~ Uniform(0, 499)</text>
  <text x="395" y="157" font-size="10" fill="#BE123C">controls how much noise to add</text>

  <!-- ε: noise (rose) -->
  <rect x="720" y="100" width="250" height="78" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="720" y="100" width="4" height="78" rx="2" fill="#F43F5E"/>
  <text x="740" y="124" font-size="12" font-weight="600" fill="#9F1239">Gaussian noise  ε</text>
  <text x="740" y="141" font-size="10" fill="#BE123C">ε ~ N(0, I),  shape (N, 3)</text>
  <text x="740" y="157" font-size="10" fill="#BE123C">the target the model must predict</text>

  <!-- arrows: inputs → forward diffusion -->
  <line x1="155" y1="178" x2="155" y2="218" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="162" y="201" font-size="9" fill="#B45309">x₀</text>
  <line x1="500" y1="178" x2="500" y2="218" stroke="#F43F5E" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="507" y="201" font-size="9" fill="#BE123C">t</text>
  <line x1="845" y1="178" x2="845" y2="218" stroke="#F43F5E" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="852" y="201" font-size="9" fill="#BE123C">ε</text>

  <!-- ═══════════════════════════════════════════
       STEP 2 — FORWARD DIFFUSION
  ═══════════════════════════════════════════ -->
  <rect x="30" y="218" width="940" height="126" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="42" y="206" width="242" height="24" rx="12" fill="#06B6D4"/>
  <text x="163" y="222" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 2 — Forward Diffusion</text>
  <rect x="784" y="206" width="180" height="24" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1"/>
  <text x="874" y="222" font-size="10" font-weight="600" fill="#0E7490" text-anchor="middle">no neural network</text>

  <!-- Formula -->
  <text x="500" y="259" font-size="16" font-weight="700" fill="#164E63" text-anchor="middle">x_t  =  √ᾱ_t · x₀  +  √(1 − ᾱ_t) · ε</text>
  <text x="500" y="280" font-size="10" font-weight="400" fill="#0E7490" text-anchor="middle">ᾱ_t follows a cosine schedule — it shrinks from ≈1 (t=0, keep signal) to ≈0 (t=499, pure noise)</text>

  <!-- Noise spectrum bar -->
  <rect x="160" y="298" width="680" height="14" rx="7" fill="url(#grad-spectrum)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="160" y="326" font-size="9" font-weight="500" fill="#B45309">t = 0   x_t ≈ x₀ (clean)</text>
  <text x="840" y="326" font-size="9" font-weight="500" fill="#BE123C" text-anchor="end">t = 499   x_t ≈ ε (pure noise)</text>

  <!-- arrow fwd diffusion → DiT, with x_t label -->
  <line x1="500" y1="344" x2="500" y2="390" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- x_t pill over arrow -->
  <rect x="402" y="351" width="196" height="22" rx="11" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="500" y="366" font-size="10" font-weight="600" fill="#C2410C" text-anchor="middle">x_t  — noisy positions (N, 3)</text>
  <!-- "model never sees x0" warning -->
  <rect x="706" y="351" width="254" height="22" rx="11" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="833" y="366" font-size="9" font-weight="600" fill="#92400E" text-anchor="middle">⚠  model never sees x₀  directly</text>

  <!-- ═══════════════════════════════════════════
       STEP 3 — DiT MODEL
  ═══════════════════════════════════════════ -->
  <rect x="30" y="390" width="940" height="152" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5" filter="url(#shadow-md)"/>
  <rect x="42" y="378" width="168" height="24" rx="12" fill="#6366F1"/>
  <text x="126" y="394" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 3 — DiT Model</text>
  <rect x="826" y="378" width="138" height="24" rx="12" fill="#1E293B"/>
  <text x="895" y="394" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6 transformer blocks</text>

  <!-- inputs label -->
  <text x="50" y="418" font-size="10" font-weight="700" fill="#4338CA">Inputs:</text>
  <text x="50" y="434" font-size="10" fill="#6366F1">· x_t   noisy positions</text>
  <text x="50" y="450" font-size="10" fill="#6366F1">· t      timestep index</text>

  <!-- center description -->
  <text x="420" y="436" font-size="12" font-weight="600" fill="#3730A3" text-anchor="middle">Self-attention across all N bricks</text>
  <text x="420" y="454" font-size="10" fill="#6366F1" text-anchor="middle">Given noisy positions at noise level t,</text>
  <text x="420" y="470" font-size="10" fill="#6366F1" text-anchor="middle">predict: what noise was added? what brick is here?</text>

  <!-- vertical divider -->
  <line x1="636" y1="402" x2="636" y2="532" stroke="#C7D2FE" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- outputs column -->
  <text x="648" y="418" font-size="10" font-weight="700" fill="#4338CA">Outputs (per brick):</text>
  <!-- ε̂ box -->
  <rect x="646" y="424" width="152" height="26" rx="7" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="722" y="441" font-size="10" font-weight="600" fill="#BE123C" text-anchor="middle">ε̂  — predicted noise  (N, 3)</text>
  <!-- part_logits -->
  <rect x="806" y="424" width="154" height="26" rx="7" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="883" y="441" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">part_logits  (N, n_parts)</text>
  <!-- color_logits -->
  <rect x="646" y="458" width="152" height="26" rx="7" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="722" y="475" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">color_logits  (N, n_colors)</text>
  <!-- rot_logits -->
  <rect x="806" y="458" width="154" height="26" rx="7" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="883" y="475" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">rot_logits  (N, 24)</text>

  <!-- arrows DiT → Loss (two streams) -->
  <!-- stream 1: ε̂ → pos_loss (left) -->
  <line x1="240" y1="542" x2="240" y2="570" stroke="#F43F5E" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="248" y="558" font-size="9" fill="#BE123C">ε̂</text>
  <!-- stream 2: logits → disc_loss (right) -->
  <line x1="760" y1="542" x2="760" y2="570" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="768" y="558" font-size="9" fill="#059669">logits</text>

  <!-- ═══════════════════════════════════════════
       STEP 4 — LOSS
  ═══════════════════════════════════════════ -->
  <text x="40" y="562" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">STEP 4 — LOSS COMPUTATION</text>

  <!-- pos_loss box (rose) -->
  <rect x="30" y="572" width="450" height="106" rx="12" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="42" y="560" width="172" height="24" rx="12" fill="#F43F5E"/>
  <text x="128" y="576" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continuous loss</text>
  <text x="255" y="603" font-size="14" font-weight="700" fill="#9F1239" text-anchor="middle">pos_loss = MSE(ε, ε̂)</text>
  <text x="255" y="621" font-size="10" fill="#BE123C" text-anchor="middle">mean squared error between true noise ε</text>
  <text x="255" y="637" font-size="10" fill="#BE123C" text-anchor="middle">and predicted noise ε̂,  non-padded bricks only</text>
  <rect x="150" y="647" width="210" height="20" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
  <text x="255" y="661" font-size="9" font-weight="600" fill="#9F1239" text-anchor="middle">always active  ·  λ_pos = 1.0</text>

  <!-- disc_loss box (emerald) -->
  <rect x="520" y="572" width="450" height="106" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="532" y="560" width="158" height="24" rx="12" fill="#10B981"/>
  <text x="611" y="576" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Discrete losses</text>
  <!-- gate badge -->
  <rect x="696" y="560" width="268" height="24" rx="12" fill="#8B5CF6"/>
  <text x="830" y="576" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">gated: only computed if t &lt; t_max</text>

  <text x="745" y="603" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">CE(part_logits, part_ids)</text>
  <text x="745" y="621" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">CE(color_logits, color_ids)</text>
  <text x="745" y="639" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">CE(rot_logits, rot_ids)</text>
  <text x="745" y="659" font-size="9" font-weight="500" fill="#10B981" text-anchor="middle">λ_part=1.0  ·  λ_color=0.5  ·  λ_rot=0.5</text>

  <!-- merge loss boxes into total -->
  <line x1="255" y1="678" x2="255" y2="696" stroke="#F43F5E" stroke-width="1.5"/>
  <line x1="745" y1="678" x2="745" y2="696" stroke="#10B981" stroke-width="1.5"/>
  <line x1="255" y1="696" x2="745" y2="696" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="500" y1="696" x2="500" y2="710" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════
       STEP 5 — TOTAL LOSS + BACKPROP
  ═══════════════════════════════════════════ -->
  <rect x="180" y="710" width="640" height="56" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="500" y="733" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle">Total = λ_pos · pos_loss  +  λ_part · part  +  λ_color · color  +  λ_rot · rot</text>
  <text x="500" y="752" font-size="11" font-weight="500" fill="#059669" text-anchor="middle">Backprop  →  AdamW optimizer  →  update DiT weights  (lr = 3×10⁻⁴)</text>

  <!-- why gate insight callout -->
  <rect x="30" y="714" width="134" height="52" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1"/>
  <text x="97" y="730" font-size="8" font-weight="700" fill="#5B21B6" text-anchor="middle">WHY GATE AT LOW t ?</text>
  <text x="97" y="744" font-size="8" fill="#7C3AED" text-anchor="middle">high t → x_t ≈ noise</text>
  <text x="97" y="757" font-size="8" fill="#7C3AED" text-anchor="middle">can't identify bricks</text>

  <!-- insight callout right -->
  <rect x="836" y="714" width="134" height="52" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="903" y="730" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">WHY MSE ON NOISE?</text>
  <text x="903" y="744" font-size="8" fill="#B45309" text-anchor="middle">predicting ε ≡ predicting</text>
  <text x="903" y="757" font-size="8" fill="#B45309" text-anchor="middle">how to reverse each step</text>

</svg>
